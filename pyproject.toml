[project]
name = "vector-core"
version = "1.4.0"
description = "Shared vector search infrastructure for MCP servers"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "michaelkrauty" }
]
requires-python = ">=3.11"
dependencies = [
    "qdrant-client~=1.16.0",
    "httpx>=0.27.0,<0.29.0",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "pathspec>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/michaelkrauty/vector-core"
Repository = "https://github.com/michaelkrauty/vector-core"

[project.optional-dependencies]
dev = [
    "mcp>=1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.100.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
mcp = [
    "mcp>=1.0",
]
security = [
    "bandit>=1.7.0",
    "pip-audit>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vector_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
strict_optional = true
show_error_codes = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PL"]
ignore = ["PLR0913", "PLR2004"]
